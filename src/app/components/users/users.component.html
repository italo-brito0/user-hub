<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Meus usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
        <ion-col>ID</ion-col>
        <ion-col>Nome</ion-col>
        <ion-col>Username</ion-col>
    </ion-row>

    <p></p>

    @for (user of users; track user.id) {
        <ion-row>
            <ion-col> {{ user.id }}</ion-col>
            <ion-col> {{ user.name }} </ion-col>
            <ion-col> {{ user.username }} </ion-col>
        </ion-row>
    }
  </ion-grid>
</ion-content>
